<!DOCTYPE html>
<html lang="fa">
<head><title>قیمت دلار | شبکه اطلاع رسانی طلا و ارز</title></head>
<body>
<div class="profile-header">
    <h1 class="title">دلار</h1>
</div>
<div class="header-info">
    <div class="info-price">
        <span class="title">قیمت زنده:</span>
        <span class="value" data-col="price">۸۸۶,۰۰۰</span>
    </div>
    <div class="info-change">
        <span class="title">تغییر:</span>
        <span data-col="change">+۳,۰۰۰</span>
        <span data-col="percent">(%۰.۳۴)</span>
    </div>
    <div class="info-low">
        <span data-col="low">۸۸۰,۰۰۰</span>
    </div>
    <div class="info-high">
        <span data-col="high">۸۸۸,۰۰۰</span>
    </div>
</div>
</body>
</html>
